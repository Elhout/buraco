<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover: the app draws under the notch and uses safe-area insets, like on phones. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <!-- Home-screen app (iPhone players install from Safari: Share → Add to Home Screen). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Buraco" />
    <meta name="theme-color" content="#F2F3F7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F1115" media="(prefers-color-scheme: dark)" />
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background-color: #f2f3f7;
      }
      body {
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background-color: #0f1115;
        }
      }
      html[data-theme='light'],
      html[data-theme='light'] body {
        background-color: #f2f3f7;
      }
      html[data-theme='dark'],
      html[data-theme='dark'] body {
        background-color: #0f1115;
      }
      .boot {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
      }
      .boot img {
        border-radius: 20px;
      }
      .boot-spinner {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: 3px solid rgba(128, 128, 128, 0.25);
        border-top-color: #d97706;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <!-- The player's Light/Dark choice (theme/scheme.ts stores it under "theme"), before the app loads. -->
    <script>
      try {
        var t = localStorage.getItem('theme')
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <!-- Shown at once while the app downloads; the app replaces it when it starts. -->
    <div id="root">
      <div class="boot" role="progressbar" aria-label="Loading Buraco">
        <img src="/icon-192.png" width="88" height="88" alt="" />
        <div class="boot-spinner"></div>
      </div>
    </div>
  </body>
</html>
